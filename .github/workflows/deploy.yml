name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/KEPA_next
          git pull origin main
          npm ci --no-audit --no-fund --prefer-offline
          npx prisma generate
          npx prisma migrate deploy
          NODE_OPTIONS="--max-old-space-size=384" npm run build
          pm2 restart kepa-next || pm2 start npm --name "kepa-next" -- start