name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/KEPA_next
          git pull origin main
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          pm2 restart KEPA-next || pm2 start npm --name "KEPA-next" -- start